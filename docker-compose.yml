version: '3.8'

services:
  redis-db:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api-server:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis-db:6379
    depends_on:
      - redis-db

  web-server:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api-server

volumes:
  redis_data: